<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Пиксельный домик</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2b1d2e; overflow: hidden; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #game { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; display: block; }
    /* Портретная ориентация: просим повернуть телефон (без текста — анимированная иконка) */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #2b1d2e;
      align-items: center; justify-content: center; }
    #rotate div { width: 60px; height: 100px; border: 6px solid #f27aa6; border-radius: 12px;
      animation: turn 2s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) { #rotate { display: flex; } }
  </style>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#2b1d2e" />
</head>
<body>
  <div id="rotate"><div></div></div>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
